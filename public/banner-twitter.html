<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeptideLog Twitter Banner 6000x2000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080810;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .canvas-wrap {
    width: 6000px;
    height: 2000px;
    position: relative;
    overflow: hidden;
  }
  .export-note {
    margin-top: 24px;
    color: #555;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="canvas-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 6000 2000" width="6000" height="2000">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="6000" height="2000" fill="#0F0F14"/>

  <!-- Subtle glow behind text -->
  <ellipse cx="3000" cy="900" rx="600" ry="150" fill="#4F46E5" opacity="0.07" filter="url(#glow)"/>

  <!-- Main wordmark -->
  <text x="3000" y="920" text-anchor="middle" dominant-baseline="central"
        font-family="'Outfit', sans-serif" font-size="320"
        letter-spacing="0.01em">
    <tspan fill="#E8E8ED" font-weight="300">Peptide</tspan><tspan fill="url(#brandGrad)" font-weight="600">Log</tspan>
  </text>

  <!-- Tagline -->
  <text x="3000" y="1150" text-anchor="middle"
        font-family="'JetBrains Mono', monospace" font-weight="400" font-size="52"
        fill="#818CF8" letter-spacing="0.3em" opacity="0.4">
    MEASURE. CALCULATE. INJECT.
  </text>

</svg>
</div>
<p class="export-note">Right-click the canvas and "Save as image", or use a screenshot tool to export at 6000x2000.</p>
</body>
</html>
