<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#030508"/>
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#00d4be" stroke-width="2" opacity="0.2"/>
  <!-- Syringe barrel -->
  <rect x="216" y="80" width="80" height="280" rx="8" fill="none" stroke="#00d4be" stroke-width="3" opacity="0.4"/>
  <!-- Fluid fill -->
  <rect x="220" y="260" width="72" height="96" rx="4" fill="url(#fg)"/>
  <!-- Plunger rod -->
  <rect x="252" y="30" width="8" height="232" rx="4" fill="#ffffff" opacity="0.15"/>
  <!-- Plunger handle -->
  <rect x="226" y="20" width="60" height="12" rx="6" fill="#ffffff" opacity="0.3"/>
  <!-- Needle connector -->
  <rect x="248" y="360" width="16" height="16" rx="2" fill="#ffffff" opacity="0.2"/>
  <!-- Needle -->
  <line x1="256" y1="376" x2="256" y2="440" stroke="#ffffff" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <!-- Draw line -->
  <line x1="200" y1="260" x2="312" y2="260" stroke="#00d4be" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- Graduation marks -->
  <line x1="296" y1="160" x2="316" y2="160" stroke="#ffffff" opacity="0.3" stroke-width="1.5"/>
  <line x1="296" y1="200" x2="316" y2="200" stroke="#ffffff" opacity="0.3" stroke-width="1.5"/>
  <line x1="296" y1="240" x2="316" y2="240" stroke="#ffffff" opacity="0.3" stroke-width="1.5"/>
  <line x1="296" y1="280" x2="316" y2="280" stroke="#ffffff" opacity="0.3" stroke-width="1.5"/>
  <line x1="296" y1="320" x2="316" y2="320" stroke="#ffffff" opacity="0.3" stroke-width="1.5"/>
  <!-- Text -->
  <text x="256" y="480" text-anchor="middle" fill="#00d4be" font-family="system-ui" font-weight="700" font-size="42">PeptideLog</text>
  <defs>
    <linearGradient id="fg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#00d4be"/>
    </linearGradient>
  </defs>
</svg>
